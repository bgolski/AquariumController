[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^4.0.4
monitor_speed = 115200
upload_speed = 460800
; 1.9 MB per app slot (two slots, for over-the-air updates); the default 1.25 MB is nearly full.
board_build.partitions = min_spiffs.csv
; Builds web/setup.html into the firmware.
extra_scripts = pre:web/build_page.py
; PlatformIO finds the board's USB serial port on its own. If more than one
; is connected, pass it explicitly: pio run -t upload --upload-port <port>

; Board-independent logic in lib/aquarium, tested on the computer:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
