[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^4.0.4
monitor_speed = 115200
upload_speed = 460800
upload_port  = /dev/tty.usbserial-51850088831
monitor_port = /dev/tty.usbserial-51850088831
extra_scripts = pre:env-extra.py
